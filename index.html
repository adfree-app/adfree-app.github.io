<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- The app icon in the three shapes a browser asks for. `?v=2` is there
         because the site used to point at a Vite bolt: a browser that cached
         that image keeps showing it until the URL changes. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdFree — an on-device ad and tracker blocker</title>
    <meta
      name="description"
      content="AdFree filters ads, trackers and annoyances on your own device with a Rust core: DNS, HTTPS and cosmetic filtering, a per-app firewall and fourteen privacy edits. No backend, no API key, no telemetry."
    />
    <meta name="theme-color" content="#05080a" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AdFree — the web, without the ads" />
    <meta
      property="og:description"
      content="An on-device ad and tracker blocker built on a Rust core. Filters on your phone, not in a cloud."
    />
    <meta property="og:image" content="/shots/desktop-home.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-default text-default antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
