<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages answers a path it has no file for with this page — and an
      // app whose routes exist only in JavaScript has no file for
      // /install-extension or /changelog. Hand the path to the router instead
      // of leaving a working page behind a 404.
      var path = location.pathname + location.search + location.hash
      location.replace('/?redirect=' + encodeURIComponent(path))
    </script>
  </head>
  <body></body>
</html>
